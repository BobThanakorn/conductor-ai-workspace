name: conductor

x-harness: &harness
  build:
    context: ./agent-harnesses
    dockerfile: common/Dockerfile
  init: true
  profiles: ["minimal", "full", "benchmark"]
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2.0
  environment:
    AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
    AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-}
    AZURE_AI_FOUNDRY_MODEL: ${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}
  secrets: [azure-api-key]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 25s

x-conductor-image: &conductor-image
  # 0.1.0 is the local reproducible image version; operators may override the
  # complete image reference without changing any secret configuration.
  image: ${CONDUCTOR_IMAGE:-conductor-ai-workspace:0.1.0}
  build:
    context: .
    dockerfile: Dockerfile

services:
  web:
    <<: *conductor-image
    command: ["npm", "run", "start:container"]
    init: true
    profiles: ["minimal", "full", "benchmark"]
    ports:
      - "127.0.0.1:${CONDUCTOR_WEB_PORT:-3000}:3000"
    environment:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "true"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-https://ai-environment-resource.services.ai.azure.com}
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-}
      AZURE_AI_FOUNDRY_MODEL: ${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}
      CONDUCTOR_PRIMARY_LLM: ${CONDUCTOR_PRIMARY_LLM:-}
      CONDUCTOR_MODEL_OPTIONS: ${CONDUCTOR_MODEL_OPTIONS:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      LANGGRAPH_AGENT_URL: http://agent-langgraph:8010
      PYDANTIC_AI_AGENT_URL: http://agent-pydanticai:8020
      CREWAI_AGENT_URL: http://agent-crewai:8020
      MICROSOFT_AGENT_FRAMEWORK_URL: http://agent-microsoft-framework:8020
      LLAMAINDEX_AGENT_URL: http://agent-llamaindex:8020
      HAYSTACK_AGENT_URL: http://agent-haystack:8020
      SEMANTIC_KERNEL_AGENT_URL: http://agent-semantic-kernel:8020
      OPENHANDS_AGENT_URL: ${OPENHANDS_AGENT_URL:-http://openhands:3000}
      LANGGRAPH_INTERNAL_TOKEN: ${LANGGRAPH_INTERNAL_TOKEN:-}
      CONDUCTOR_HANDOFF_SIGNING_SECRET: ${CONDUCTOR_HANDOFF_SIGNING_SECRET:-}
      CONDUCTOR_AGENT_QUOTA_PER_MINUTE: ${CONDUCTOR_AGENT_QUOTA_PER_MINUTE:-60}
      CONDUCTOR_AUTOMATION_QUOTA_PER_MINUTE: ${CONDUCTOR_AUTOMATION_QUOTA_PER_MINUTE:-30}
      CONDUCTOR_TRUST_PLATFORM_IDENTITY: ${CONDUCTOR_TRUST_PLATFORM_IDENTITY:-false}
      CONDUCTOR_AUTOMATION_SCHEDULER_SECRET: ${CONDUCTOR_AUTOMATION_SCHEDULER_SECRET:-}
      CONDUCTOR_AUTOMATION_WEBHOOK_SECRET: ${CONDUCTOR_AUTOMATION_WEBHOOK_SECRET:-}
    secrets:
      - openai-api-key
      - azure-api-key
    volumes:
      - conductor-data:/data
    depends_on:
      companion:
        condition: service_healthy
      companion-langgraph:
        condition: service_healthy
      agent-langgraph:
        condition: service_healthy
      agent-pydanticai:
        condition: service_healthy
      agent-crewai:
        condition: service_healthy
    networks:
      - default
      - companion-private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5

  companion:
    <<: *conductor-image
    command: ["npm", "run", "companion:git"]
    init: true
    profiles: ["minimal", "full", "benchmark"]
    ports:
      - "127.0.0.1:${CONDUCTOR_COMPANION_PORT:-8765}:8765"
    environment:
      CONDUCTOR_COMPANION_HOST: 0.0.0.0
      CONDUCTOR_COMPANION_PORT: 8765
      CONDUCTOR_WORKSPACE_ROOT: /workspace
      CONDUCTOR_EXECUTION_MODE: container
      CONDUCTOR_ALLOWED_ORIGINS: ${CONDUCTOR_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://conductor-workspace-20260715.galilrevanov.chatgpt.site}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      GIT_TERMINAL_PROMPT: "0"
    volumes:
      - type: bind
        source: ${WORKSPACE_PATH:-.}
        target: /workspace
    networks:
      - companion-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

  companion-langgraph:
    <<: *conductor-image
    command: ["npm", "run", "companion:git"]
    init: true
    profiles: ["minimal", "full", "benchmark"]
    ports:
      - "127.0.0.1:${CONDUCTOR_LANGGRAPH_COMPANION_PORT:-8766}:8765"
    environment:
      CONDUCTOR_COMPANION_HOST: 0.0.0.0
      CONDUCTOR_COMPANION_PORT: 8765
      CONDUCTOR_WORKSPACE_ROOT: /workspace
      CONDUCTOR_EXECUTION_MODE: container
      CONDUCTOR_ALLOWED_ORIGINS: ${CONDUCTOR_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      GIT_TERMINAL_PROMPT: "0"
    volumes:
      - type: bind
        source: ${WORKSPACE_PATH:-.}
        target: /workspace
    networks:
      - companion-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

  agent-langgraph:
    build:
      context: ./langgraph-agent
      dockerfile: Dockerfile
    image: ${CONDUCTOR_LANGGRAPH_IMAGE:-conductor-langgraph-agent:0.1.0}
    init: true
    profiles: ["minimal", "full", "benchmark"]
    environment:
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-https://ai-environment-resource.services.ai.azure.com}
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-}
      AZURE_AI_FOUNDRY_MODEL: ${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B}
      LANGGRAPH_CHECKPOINT_PATH: /data/langgraph/checkpoints.sqlite
      LANGGRAPH_INTERNAL_TOKEN: ${LANGGRAPH_INTERNAL_TOKEN:-}
    secrets:
      - azure-api-key
    volumes:
      - langgraph-data:/data/langgraph
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 192
    mem_limit: 1g
    cpus: 1.5

  agent-pydanticai:
    <<: *harness
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/pydanticai.lock } }
    image: conductor-agent-pydanticai:0.1.0
    environment: { HARNESS_ID: pydantic-ai, HARNESS_MODULE: pydantic_ai, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_API_KEY: "${AZURE_AI_FOUNDRY_API_KEY:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }

  agent-microsoft-framework:
    <<: *harness
    profiles: ["full", "benchmark"]
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/microsoft-agent-framework.lock } }
    image: conductor-agent-microsoft-framework:0.1.0
    environment: { HARNESS_ID: microsoft-agent-framework, HARNESS_MODULE: agent_framework, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_API_KEY: "${AZURE_AI_FOUNDRY_API_KEY:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }

  agent-crewai:
    <<: *harness
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/crewai.lock } }
    image: conductor-agent-crewai:0.1.0
    environment: { HARNESS_ID: crewai, HARNESS_MODULE: crewai, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_API_KEY: "${AZURE_AI_FOUNDRY_API_KEY:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }

  agent-llamaindex:
    <<: *harness
    profiles: ["full", "benchmark"]
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/llamaindex.lock } }
    image: conductor-agent-llamaindex:0.1.0
    environment: { HARNESS_ID: llamaindex, HARNESS_MODULE: llama_index, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_API_KEY: "${AZURE_AI_FOUNDRY_API_KEY:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }

  agent-haystack:
    <<: *harness
    profiles: ["full", "benchmark"]
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/haystack.lock } }
    image: conductor-agent-haystack:0.1.0
    environment: { HARNESS_ID: haystack, HARNESS_MODULE: haystack, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_API_KEY: "${AZURE_AI_FOUNDRY_API_KEY:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }

  agent-semantic-kernel:
    <<: *harness
    profiles: ["full", "benchmark"]
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/semantic-kernel.lock } }
    image: conductor-agent-semantic-kernel:0.1.0
    environment: { HARNESS_ID: semantic-kernel, HARNESS_MODULE: semantic_kernel, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_API_KEY: "${AZURE_AI_FOUNDRY_API_KEY:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }

  openhands:
    image: ${OPENHANDS_IMAGE:-ghcr.io/all-hands-ai/openhands:0.19.0}
    profiles: ["full", "benchmark"]
    environment:
      SANDBOX_RUNTIME_CONTAINER_IMAGE: ${OPENHANDS_SANDBOX_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:0.19.0}
      OPENHANDS_LLM_MODEL: ${OPENHANDS_LLM_MODEL:-}
      OPENHANDS_LLM_API_KEY: ${OPENHANDS_LLM_API_KEY:-}
      OPENHANDS_LLM_BASE_URL: ${OPENHANDS_LLM_BASE_URL:-}
    volumes:
      - openhands-data:/openhands
    networks:
      - openhands-private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0

volumes:
  conductor-data:
  langgraph-data:
  openhands-data:

networks:
  companion-private:
    internal: true
  openhands-private:
    internal: true

secrets:
  openai-api-key:
    file: ${OPENAI_API_KEY_FILE:-./secret.openai-api-key}
  azure-api-key:
    file: ${AZURE_AI_FOUNDRY_API_KEY_FILE:-./secret.azure-api-key}
