services:
  web:
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-gpt-5.6-terra}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    secrets:
      - openai-api-key

secrets:
  openai-api-key:
    file: ${OPENAI_API_KEY_FILE:-./secret.openai-api-key}
