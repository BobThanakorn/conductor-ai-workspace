name: container-evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-scan-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # These values only satisfy Compose validation/build interpolation. The
      # workflow never starts the full MCP profile or contacts a provider.
      MCP_GATEWAY_AUTH_TOKEN: ci-config-placeholder-not-a-secret
      MCP_SECRET_FILE: /tmp/conductor-ci-mcp.env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare non-secret Compose inputs
        run: |
          : > "$MCP_SECRET_FILE"
      - name: Install pinned Docker Scout CLI
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/docker-scout.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/docker/scout-cli/releases/download/v1.23.1/docker-scout_1.23.1_linux_amd64.tar.gz \
            --output "$archive"
          echo "0f778f9d833f28bc6cccff95e33039849c0afcecafa38d9f46fe74bfd0915714  $archive" | sha256sum --check --strict
          mkdir -p "$HOME/.docker/cli-plugins"
          tar --extract --gzip --file "$archive" --directory "$HOME/.docker/cli-plugins"
          chmod 0755 "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version
      - name: Validate minimal profile
        run: docker compose --profile minimal config --quiet
      - name: Validate full profile
        run: docker compose -f compose.yaml -f compose.mcp.yaml --profile full config --quiet
      - name: Validate benchmark profile
        run: docker compose -f compose.yaml -f compose.mcp.yaml -f compose.harnesses.yaml --profile benchmark config --quiet
      - name: Build minimal images
        run: docker compose --profile minimal build
      - name: Build full and benchmark images
        run: docker compose -f compose.yaml -f compose.mcp.yaml -f compose.harnesses.yaml --profile benchmark build
      - name: Generate SBOM and vulnerability evidence
        shell: pwsh
        run: ./scripts/container-evidence.ps1
      - name: Fresh-machine minimal smoke
        shell: pwsh
        run: ./scripts/fresh-machine-smoke.ps1
      - name: Upload container evidence
        if: ${{ always() && hashFiles('artifacts/container-evidence/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-evidence
          path: artifacts/container-evidence/
          if-no-files-found: error
