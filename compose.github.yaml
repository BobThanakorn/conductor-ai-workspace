services:
  web:
    environment:
      # GitHub App values are consumed only by server routes. Installation
      # tokens are minted per request and never enter either companion.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      CONDUCTOR_PUBLICATION_SIGNING_SECRET: ${CONDUCTOR_PUBLICATION_SIGNING_SECRET:-}
