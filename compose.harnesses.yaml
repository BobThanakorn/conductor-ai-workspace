x-harness: &harness
  build:
    context: ./agent-harnesses
    dockerfile: common/Dockerfile
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2.0
  environment:
    AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
    AZURE_AI_FOUNDRY_MODEL: ${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}
  secrets: [azure-api-key]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 25s

services:
  web:
    environment:
      PYDANTIC_AI_AGENT_URL: http://agent-pydanticai:8020
      CREWAI_AGENT_URL: http://agent-crewai:8020
      MICROSOFT_AGENT_FRAMEWORK_URL: http://agent-microsoft-framework:8020
      LLAMAINDEX_AGENT_URL: http://agent-llamaindex:8020
      HAYSTACK_AGENT_URL: http://agent-haystack:8020
      SEMANTIC_KERNEL_AGENT_URL: http://agent-semantic-kernel:8020
    depends_on:
      agent-pydanticai:
        condition: service_healthy
      agent-crewai:
        condition: service_healthy
      agent-microsoft-framework:
        condition: service_healthy
      agent-llamaindex:
        condition: service_healthy
      agent-haystack:
        condition: service_healthy
      agent-semantic-kernel:
        condition: service_healthy
  agent-pydanticai:
    <<: *harness
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/pydanticai.txt } }
    image: conductor-agent-pydanticai:local
    environment: { HARNESS_ID: pydantic-ai, HARNESS_MODULE: pydantic_ai, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }
  agent-microsoft-framework:
    <<: *harness
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/microsoft-agent-framework.txt } }
    image: conductor-agent-microsoft-framework:local
    environment: { HARNESS_ID: microsoft-agent-framework, HARNESS_MODULE: agent_framework, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }
  agent-crewai:
    <<: *harness
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/crewai.txt } }
    image: conductor-agent-crewai:local
    environment: { HARNESS_ID: crewai, HARNESS_MODULE: crewai, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }
  agent-llamaindex:
    <<: *harness
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/llamaindex.txt } }
    image: conductor-agent-llamaindex:local
    environment: { HARNESS_ID: llamaindex, HARNESS_MODULE: llama_index, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }
  agent-haystack:
    <<: *harness
    build: { context: ./agent-harnesses, dockerfile: common/Dockerfile, args: { REQUIREMENTS: requirements/haystack.txt } }
    image: conductor-agent-haystack:local
    environment: { HARNESS_ID: haystack, HARNESS_MODULE: haystack, AZURE_AI_FOUNDRY_ENDPOINT: "${AZURE_AI_FOUNDRY_ENDPOINT:-}", AZURE_AI_FOUNDRY_MODEL: "${AZURE_AI_FOUNDRY_MODEL:-gpt-5.1-codex-mini}" }
  agent-semantic-kernel:
